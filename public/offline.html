<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a4a91" />
    <title>Sin conexión · Suite U3</title>
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        background: hsl(220, 20%, 97%);
        color: hsl(224, 47%, 8%);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 380px;
        text-align: center;
        background: #fff;
        border: 1px solid hsl(220, 13%, 89%);
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
      }
      img {
        width: 56px;
        height: 56px;
        object-fit: contain;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 16px 0 8px;
      }
      p {
        font-size: 14px;
        line-height: 1.5;
        color: hsl(220, 9%, 46%);
        margin: 0;
      }
      button {
        margin-top: 24px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: hsl(221, 83%, 53%);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
      }
      button:active {
        background: hsl(221, 83%, 46%);
      }
      .status {
        margin-top: 14px;
        font-size: 12px;
        color: hsl(220, 9%, 46%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo_b.png" alt="U3 Seguridad Privada" />
      <h1>Sin conexión</h1>
      <p>No pudimos contactar al servidor. Revisa tu conexión de datos o Wi-Fi y vuelve a intentarlo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
      <p class="status" id="status">Esperando conexión…</p>
    </div>
    <script>
      var status = document.getElementById('status');
      function render() {
        status.textContent = navigator.onLine
          ? 'Conexión restablecida. Recargando…'
          : 'Esperando conexión…';
      }
      window.addEventListener('online', function () {
        render();
        location.reload();
      });
      window.addEventListener('offline', render);
      render();
    </script>
  </body>
</html>
